# Corpus sources approved for RAHBAR (CS4032 Assignment 02)
# Covers all 7 properties using FAST-NUCES public documents

documents:
  # Property 2: Two versions of one policy & Property 7: exact clause numbers
  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: Current official version. ~53 pages, numbered clauses (e.g. clause 1.21 attendance, clause 5.4 warning).

  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true
    notes: Superseded policy version. Still linked from /Student/RulesUndergrad.

  # Property 2 (parallel policy) & Property 7: exact terms
  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false
    notes: Rules in 5 pages with distinct clause numbering (e.g. attendance is clause 1 vs 1.21 in Handbook).

  # Property 3: Scanned PDF with no text layer (requires OCR)
  - name: Faculty Entrepreneurship and Technical Start-ups Policy
    url: https://nu.edu.pk/OricResources/ResearchPolicies/27.pdf?20220530
    doc_version: "2022-05"
    superseded: false
    notes: Image-only scan confirmed by empty pdffonts output. Exercises OCR pipeline stage A.

  # Property 4: Tables with real information
  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false
    notes: Statistical report with campus-wise faculty, graduates, and publication tables.

  - name: Grading Criteria
    url: https://www.nu.edu.pk/Student/Grading
    doc_version: "2026"
    superseded: false
    notes: Structured HTML table with grade points, percentage bands, and academic standing formulas.

  # Property 5: Long definitions that fixed-size chunker slices
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: ~60 pages. Contains multi-paragraph Generative AI policy with nested subsections.

