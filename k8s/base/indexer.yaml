apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rahbar
        app.kubernetes.io/component: indexer
    spec:
      serviceAccountName: rahbar-indexer-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: rahbar-config
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
      volumes:
        - name: corpus-volume
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: indexer
spec:
  schedule: "0 2 * * 0"  # Weekly at 02:00 UTC on Sunday
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rahbar
            app.kubernetes.io/component: indexer
        spec:
          serviceAccountName: rahbar-indexer-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: indexer
              image: rahbar-indexer:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - configMapRef:
                    name: rahbar-config
              volumeMounts:
                - name: corpus-volume
                  mountPath: /corpus
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 3Gi
          volumes:
            - name: corpus-volume
              emptyDir: {}
