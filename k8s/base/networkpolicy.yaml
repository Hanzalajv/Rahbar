# Default deny-all ingress and egress policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow egress to kube-dns across all workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-dns
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# UI ingress policy: accepts connections from Ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahbar
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
# API network policy: accepts from UI and Ingress; allows egress to Chroma, Redis, DNS, and Host
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahbar
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: ui
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Egress to Ollama host / external endpoints
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
---
# Chroma network policy: strictly allows ingress from API and Indexer ONLY (UI cannot reach Chroma)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: chroma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahbar
      app.kubernetes.io/component: chroma
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: indexer
      ports:
        - protocol: TCP
          port: 8000
---
# Redis network policy: allows ingress from API ONLY
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahbar
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 6379
---
# Indexer egress policy: allows egress to Chroma, DNS, and Ollama/host
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: indexer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rahbar
      app.kubernetes.io/component: indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rahbar
              app.kubernetes.io/component: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
